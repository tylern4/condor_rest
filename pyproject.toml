[project]
name = "htcondor-rest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Nick Tyler", email = "nicholas.s.tyler.4@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.136.1",
    "gunicorn>=25.3.0",
    "htcondor>=25.8.2",
    "uvicorn>=0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest-asyncio>=1.3.0", "pytest>=9.0.3"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "PYI", "RUF", "PIE", "PLW0602"]
ignore = [
    "BLE001",  # deliberate: REST wrapper converts C-API errors to HTTP 500s
]

[tool.typos.default]
extend-ignore-re = ["(?i)startd", "(?i)schedd", "(?i)restd", "(?i)negotiator"]
