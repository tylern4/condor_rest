[project]
name = "htcondor-rest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Nick Tyler", email = "nicholas.s.tyler.4@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "loguru>=0.7.3",
    "typer>=0.15.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.136.1",
    "gunicorn>=25.3.0",
    "htcondor>=25.8.2",
    "uvicorn>=0.46.0",
]

[project.scripts]
htcondor-rest = "htcondor_rest:main"
condor_submit = "htcondor_rest.cli:submit_main"
condor_q = "htcondor_rest.cli:q_main"
condor_rm = "htcondor_rest.cli:rm_main"
condor_history = "htcondor_rest.cli:history_main"
condor_status = "htcondor_rest.cli:status_main"
condor_hold = "htcondor_rest.cli:hold_main"
condor_release = "htcondor_rest.cli:release_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest-asyncio>=1.3.0", "pytest>=9.0.3"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "PYI", "RUF", "PIE", "PLW0602"]
ignore = [
    "BLE001",  # deliberate: REST wrapper converts C-API errors to HTTP 500s
    "B008",    # typer.Argument()/Option() in defaults is the typer idiom
]

[tool.typos.default]
extend-ignore-re = ["(?i)startd", "(?i)schedd", "(?i)restd", "(?i)negotiator"]
